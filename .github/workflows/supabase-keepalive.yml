name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *"     # daily at 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    if: github.repository == 'aishdwivedi27/AI_Governance'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping database
        env:
          DB_URL: ${{ secrets.SUPABASE_KEEPALIVE_URL }}
        run: |
          if [ -z "$DB_URL" ]; then echo "SUPABASE_KEEPALIVE_URL secret not set"; exit 1; fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$DB_URL" -qtAc "select 1" >/dev/null
          echo "keep-alive OK"
